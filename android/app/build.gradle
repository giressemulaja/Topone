plugins { id 'com.android.application' }

// Clé de signature : fichier keystore.properties (non versionné), voir README.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.gmcorporate.cabine'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    flavorDimensions 'app'
    productFlavors {
        jetons {
            dimension 'app'
            applicationId 'com.gmcorporate.jetons'
            resValue 'string', 'app_name', 'GM Jetons'
            resValue 'string', 'app_title', 'Jetons Cabine de Charge'
            resValue 'color', 'icon_bg', '#FFFFFF'
        }
        registre {
            dimension 'app'
            applicationId 'com.gmcorporate.registre'
            resValue 'string', 'app_name', 'GM Registre'
            resValue 'string', 'app_title', 'Registre de la cabine'
            resValue 'color', 'icon_bg', '#FBEDE7'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "${variant.applicationId.tokenize('.').last()}-GM-Corporate-${variant.versionName}.apk" }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
